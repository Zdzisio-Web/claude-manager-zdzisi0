name: Build Claude Manager by Zdzisi0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/pl/zdzisi0/claudmanager

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ClaudeManagerByZdzisi0"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'pl.zdzisi0.claudmanager'
              compileSdk 35

              defaultConfig {
                  applicationId 'pl.zdzisi0.claudmanager'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Claude Manager by Zdzisi0"
                  android:allowBackup="false"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/pl/zdzisi0/claudmanager/MainActivity.java <<'EOF'
          package pl.zdzisi0.claudmanager;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
              private final int BG = Color.rgb(13,18,32), PANEL = Color.rgb(25,33,53);
              private final int ACCENT = Color.rgb(117,143,255), MUTED = Color.rgb(166,178,202);
              private SharedPreferences prefs;
              private ArrayList<Account> accounts = new ArrayList<>();
              private LinearLayout accountList;
              private EditText taskEdit;
              private int activeIndex = 0;

              static class Account {
                  String name; boolean available;
                  Account(String n, boolean a) { name=n; available=a; }
              }

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs=getSharedPreferences("manager",MODE_PRIVATE);
                  load(); buildUi();
              }

              private void buildUi() {
                  ScrollView scroll=new ScrollView(this);
                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(1); root.setPadding(dp(20),dp(26),dp(20),dp(28));
                  root.setBackgroundColor(BG); scroll.addView(root);

                  TextView brand=text("CLAUDE MANAGER",12,ACCENT,true);
                  brand.setLetterSpacing(.12f); root.addView(brand);
                  root.addView(text("by Zdzisi0",29,Color.WHITE,true));
                  root.addView(text("Prosty organizer kont i kontekstu pracy",14,MUTED,false));
                  gap(root,18);
                  LinearLayout note=panel();
                  note.addView(text("Wersja 1.0: aplikacja nie odczytuje limitów ani nie przełącza kont w Claude automatycznie. Pozwala ręcznie zarządzać listą kont i przenosić kontekst rozmowy.",13,MUTED,false));
                  root.addView(note); gap(root,22);
                  root.addView(section("TWOJE KONTA"));
                  accountList=new LinearLayout(this); accountList.setOrientation(1); root.addView(accountList);
                  Button add=button("+  Dodaj konto"); add.setOnClickListener(v->addAccount()); root.addView(add);
                  gap(root,24); root.addView(section("KONTEKST ZADANIA"));
                  TextView hint=text("Opisz, nad czym pracujesz. Instrukcję kontynuacji skopiujesz do nowego czatu.",13,MUTED,false);
                  hint.setPadding(0,dp(6),0,dp(10)); root.addView(hint);
                  taskEdit=new EditText(this); taskEdit.setTextColor(Color.WHITE); taskEdit.setHintTextColor(MUTED);
                  taskEdit.setHint("Opisz zadanie, ustalenia i następny krok...");
                  taskEdit.setTextSize(15); taskEdit.setGravity(Gravity.TOP|Gravity.START);
                  taskEdit.setMinLines(5); taskEdit.setPadding(dp(14),dp(12),dp(14),dp(12));
                  taskEdit.setBackground(round(PANEL,14)); taskEdit.setText(prefs.getString("task",""));
                  root.addView(taskEdit,new LinearLayout.LayoutParams(-1,dp(150)));
                  Button save=button("Zapisz kontekst");
                  save.setOnClickListener(v->{prefs.edit().putString("task",taskEdit.getText().toString()).apply(); toast("Kontekst zapisany.");});
                  root.addView(save);
                  Button copy=button("Kopiuj instrukcję kontynuacji");
                  copy.setBackground(round(Color.rgb(57,75,145),14)); copy.setOnClickListener(v->copyHandoff()); root.addView(copy);
                  gap(root,20);
                  TextView footer=text("Wersja 1.0 • Dane lokalnie na telefonie",11,MUTED,false);
                  footer.setGravity(Gravity.CENTER); root.addView(footer);
                  setContentView(scroll); renderAccounts();
              }

              private void renderAccounts() {
                  accountList.removeAllViews();
                  if(accounts.isEmpty()) {
                      LinearLayout empty=panel(); empty.addView(text("Nie dodano jeszcze żadnego konta.",14,MUTED,false)); accountList.addView(empty); return;
                  }
                  for(int i=0;i<accounts.size();i++) {
                      final int ix=i; Account a=accounts.get(i); LinearLayout card=panel();
                      LinearLayout row=new LinearLayout(this); row.setGravity(Gravity.CENTER_VERTICAL);
                      LinearLayout details=new LinearLayout(this); details.setOrientation(1);
                      details.addView(text(a.name+(i==activeIndex?"  ✓":""),16,Color.WHITE,true));
                      details.addView(text(a.available?"Status: oznaczone jako dostępne":"Status: limit oznaczony jako wykorzystany",12,a.available?ACCENT:Color.rgb(255,177,117),false));
                      row.addView(details,new LinearLayout.LayoutParams(0,-2,1));
                      Button select=small(i==activeIndex?"Aktywne":"Wybierz");
                      select.setOnClickListener(v->{activeIndex=ix;save();renderAccounts();}); row.addView(select); card.addView(row);
                      LinearLayout actions=new LinearLayout(this);
                      Button status=small(a.available?"Oznacz limit":"Oznacz dostępne");
                      status.setOnClickListener(v->{a.available=!a.available;save();renderAccounts();});
                      Button remove=small("Usuń");
                      remove.setOnClickListener(v->new AlertDialog.Builder(this).setMessage("Usunąć konto „"+a.name+"”?")
                          .setNegativeButton("Anuluj",null).setPositiveButton("Usuń",(d,w)->{
                              accounts.remove(ix); if(accounts.isEmpty())activeIndex=0; else if(activeIndex>=accounts.size())activeIndex=accounts.size()-1;
                              save();renderAccounts();
                          }).show());
                      actions.addView(status,new LinearLayout.LayoutParams(0,dp(42),1));
                      actions.addView(remove,new LinearLayout.LayoutParams(0,dp(42),1)); card.addView(actions);
                      accountList.addView(card); gap(accountList,8);
                  }
              }

              private void addAccount() {
                  EditText input=new EditText(this); input.setSingleLine(true); input.setHint("Np. Konto prywatne");
                  new AlertDialog.Builder(this).setTitle("Dodaj konto Claude")
                      .setMessage("Podaj nazwę konta. Nie wpisuj hasła, kodu logowania ani tokenu.")
                      .setView(input).setNegativeButton("Anuluj",null).setPositiveButton("Dodaj",(d,w)->{
                          String n=input.getText().toString().trim(); if(n.isEmpty())n="Konto "+(accounts.size()+1);
                          accounts.add(new Account(n,true)); save();renderAccounts();
                      }).show();
              }

              private void copyHandoff() {
                  String task=taskEdit.getText().toString().trim(); prefs.edit().putString("task",task).apply();
                  String prompt="Kontynuujemy pracę rozpoczętą w innej rozmowie. Przeczytaj kontekst, krótko potwierdź, co rozumiesz, a następnie kontynuuj od wskazanego kroku. Jeśli brakuje ważnych informacji, zadaj jedno konkretne pytanie.\\n\\nKONTEKST:\\n"+(task.isEmpty()?"[Uzupełnij kontekst zadania.]":task);
                  ClipboardManager cm=(ClipboardManager)getSystemService(Context.CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("Kontynuacja Claude",prompt));
                  toast("Skopiowano. Wklej instrukcję w nowym czacie Claude.");
              }

              private void load() {
                  try {
                      JSONArray a=new JSONArray(prefs.getString("accounts","[]"));
                      for(int i=0;i<a.length();i++){JSONObject o=a.getJSONObject(i);accounts.add(new Account(o.optString("name","Konto"),o.optBoolean("available",true)));}
                      activeIndex=prefs.getInt("active",0); if(activeIndex>=accounts.size())activeIndex=0;
                  } catch(Exception e){accounts.clear();}
              }
              private void save() {
                  JSONArray a=new JSONArray();
                  try { for(Account x:accounts){JSONObject o=new JSONObject();o.put("name",x.name);o.put("available",x.available);a.put(o);}
                      prefs.edit().putString("accounts",a.toString()).putInt("active",activeIndex).apply();
                  } catch(Exception ignored){}
              }
              private LinearLayout panel(){LinearLayout l=new LinearLayout(this);l.setOrientation(1);l.setPadding(dp(14),dp(13),dp(14),dp(13));l.setBackground(round(PANEL,16));return l;}
              private TextView section(String s){TextView t=text(s,12,ACCENT,true);t.setLetterSpacing(.1f);return t;}
              private TextView text(String s,int size,int color,boolean bold){TextView t=new TextView(this);t.setText(s);t.setTextSize(size);t.setTextColor(color);if(bold)t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);return t;}
              private Button button(String s){Button b=new Button(this);b.setText(s);b.setTextColor(Color.WHITE);b.setAllCaps(false);b.setTextSize(14);b.setBackground(round(ACCENT,14));LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,dp(48));p.topMargin=dp(9);b.setLayoutParams(p);return b;}
              private Button small(String s){Button b=new Button(this);b.setText(s);b.setTextColor(Color.WHITE);b.setAllCaps(false);b.setTextSize(11);b.setMinHeight(0);b.setMinimumHeight(0);b.setPadding(dp(5),0,dp(5),0);b.setBackground(round(Color.rgb(55,67,98),10));LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-2,dp(40));p.leftMargin=dp(5);b.setLayoutParams(p);return b;}
              private GradientDrawable round(int c,int r){GradientDrawable d=new GradientDrawable();d.setColor(c);d.setCornerRadius(dp(r));return d;}
              private void gap(LinearLayout l,int h){View v=new View(this);l.addView(v,new LinearLayout.LayoutParams(1,dp(h)));}
              private int dp(int v){return (int)(v*getResources().getDisplayMetrics().density+.5f);}
              private void toast(String s){Toast.makeText(this,s,Toast.LENGTH_LONG).show();}
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Manager-by-Zdzisi0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
